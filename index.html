<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Medical Data Visualizer</title>
		<link rel="icon" type="image/x-icon" href="others/favicon.ico">
		<style>
			body { margin: 0; }
		</style>
	</head>

<body>
	<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@v0.149.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.149.0/examples/jsm/"
			  }
		}
	</script>

	<script type="module">

	import * as THREE from 'three';
	import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
	import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
	import { NRRDLoader } from 'three/addons/loaders/NRRDLoader.js';
	import { VolumeRenderShader1 } from 'three/addons/shaders/VolumeShader.js';

	const volumes = [];
    const directories = [];

    let renderer, scene, camera, controls, material, volconfig, data, cmtextures;
    
    const directoryLabels = {};
    const dataLabels = {};
    const dentition = [];
    const mandible = [];
    const maxillaryComplex = [];
    const maxillarySinus = [];
    const nerve = [];
    const pharynx = [];
    const skull = [];
    let index = 1;
    let volumeDentitionMesh = null;

    init();

    function setup() {
        doRequestFile("/volumi", false);
        for (const dir of directories) {
            doRequestFile(dir, true);
        }
    }

    function init() {
        setup();

        scene = new THREE.Scene();

        // Create renderer
        renderer = new THREE.WebGLRenderer();
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Create camera (The volume renderer does not work very well with perspective yet)
        const h = 512; // frustum height
        const aspect = window.innerWidth / window.innerHeight;
        camera = new THREE.OrthographicCamera(-h * aspect / 2, h * aspect / 2, h / 2, -h / 2, 1, 1000);
        camera.position.set(-64, -64, 128);
        camera.up.set(0, 0, 1); // In our data, z is up

        // Create controls
        controls = new OrbitControls(camera, renderer.domElement);
        controls.addEventListener('change', render);
        controls.target.set(64, 64, 128);
        controls.minZoom = 0.5;
        controls.maxZoom = 4;
        controls.enablePan = false;
        controls.update();

        // The GUI for interaction
        volconfig = {
            clim1: 0, clim2: 1, renderstyle: 'iso', isothreshold: 0.85, colormap: 'viridis',
            data: volumes[0], showDentition: false
        };
        const gui = new GUI();
        gui.add(volconfig, 'clim1', 0, 1, 0.01).onChange(updateUniforms);
        gui.add(volconfig, 'clim2', 0, 1, 0.01).onChange(updateUniforms);
        gui.add(volconfig, 'colormap', { gray: 'gray', viridis: 'viridis' }).onChange(updateUniforms);
        gui.add(volconfig, 'renderstyle', { mip: 'mip', iso: 'iso' }).onChange(updateUniforms);
        gui.add(volconfig, 'isothreshold', 0, 1, 0.01).onChange(updateUniforms);
        gui.add(volconfig, 'data', dataLabels).onChange(updateVolume);
        gui.add(volconfig, 'showDentition').onChange(toggleAdditionalVolume);
		loadVolume(volconfig.data);

        window.addEventListener('resize', onWindowResize);
    }

    function updateUniforms() {
        material.uniforms['u_clim'].value.set(volconfig.clim1, volconfig.clim2);
        material.uniforms['u_renderstyle'].value = volconfig.renderstyle == 'mip' ? 0 : 1; // 0: MIP, 1: ISO
        material.uniforms['u_renderthreshold'].value = volconfig.isothreshold; // For ISO renderstyle
        material.uniforms['u_cmdata'].value = cmtextures[volconfig.colormap];
		if (volumeDentitionMesh) {
			//POSSIBILE CONFIGURAZIONE CORRETTA: CLIM1:0, CLIM2:0.02/0.01
            //volumeDentitionMesh.material.uniforms['u_clim'].value.set(0, 0.02);
            volumeDentitionMesh.material.uniforms['u_renderstyle'].value = volconfig.renderstyle == 'mip' ? 0 : 1; // 0: MIP, 1: ISO
            //volumeDentitionMesh.material.uniforms['u_renderthreshold'].value = 0; // For ISO renderstyle
            volumeDentitionMesh.material.uniforms['u_cmdata'].value = cmtextures[volconfig.colormap];
        }
        render();
    }

    function updateVolume() {
    
    scene.clear();

    
    loadVolume(volconfig.data, function() {
        
        if (volconfig.showDentition) {
            loadAdditionalVolume(dentition[volumes.indexOf(volconfig.data)]);
        }
    });
}

function loadVolume(data, onLoadCallback) {
    new NRRDLoader().load(data, function (volume) {
        // Setup texture and material for the main volume
        const texture = new THREE.Data3DTexture(volume.data, volume.xLength, volume.yLength, volume.zLength);
        texture.format = THREE.RedFormat;
        texture.type = THREE.UnsignedByteType;
        texture.minFilter = texture.magFilter = THREE.LinearFilter;
        texture.needsUpdate = true;

        cmtextures = {
            viridis: new THREE.TextureLoader().load('/others/cm_viridis.png', render),
            gray: new THREE.TextureLoader().load('/others/cm_gray.png', render)
        };

        const shader = VolumeRenderShader1;
        const uniforms = THREE.UniformsUtils.clone(shader.uniforms);

        uniforms['u_data'].value = texture;
        uniforms['u_size'].value.set(volume.xLength, volume.yLength, volume.zLength);
        uniforms['u_clim'].value.set(volconfig.clim1, volconfig.clim2);
        uniforms['u_renderstyle'].value = volconfig.renderstyle == 'mip' ? 0 : 1;
        uniforms['u_renderthreshold'].value = volconfig.isothreshold;
        uniforms['u_cmdata'].value = cmtextures[volconfig.colormap];

        material = new THREE.ShaderMaterial({
            uniforms: uniforms,
            vertexShader: shader.vertexShader,
            fragmentShader: shader.fragmentShader,
            side: THREE.BackSide
        });

        const geometry = new THREE.BoxGeometry(volume.xLength, volume.yLength, volume.zLength);
        geometry.translate(volume.xLength / 2 - 0.5, volume.yLength / 2 - 0.5, volume.zLength / 2 - 0.5);

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        render();

        if (onLoadCallback) {
            onLoadCallback();
        }
    });
}

    function toggleAdditionalVolume() {
        if (volumeDentitionMesh) {
            scene.remove(volumeDentitionMesh);
            volumeDentitionMesh = null;
			//updateVolume();
        }
		if (volconfig.showDentition) {
            loadAdditionalVolume(dentition[volumes.indexOf(volconfig.data)]);
        }

    }

    function loadAdditionalVolume(data) {
        new NRRDLoader().load(data, function (volume) {
            const texture = new THREE.Data3DTexture(volume.data, volume.xLength, volume.yLength, volume.zLength);
            texture.format = THREE.RedFormat;
            texture.type = THREE.UnsignedByteType;
            texture.minFilter = texture.magFilter = THREE.LinearFilter;
            texture.needsUpdate = true;

            const shader = VolumeRenderShader1;
            const uniforms = THREE.UniformsUtils.clone(shader.uniforms);

            uniforms['u_data'].value = texture;
            uniforms['u_size'].value.set(volume.xLength, volume.yLength, volume.zLength);
            uniforms['u_clim'].value.set(0.0, 0.02);
            uniforms['u_renderstyle'].value = volconfig.renderstyle == 'mip' ? 0 : 1; // 0: MIP, 1: ISO
            uniforms['u_renderthreshold'].value = 0.0; // For ISO renderstyle
            uniforms['u_cmdata'].value = cmtextures[volconfig.colormap];

            const material = new THREE.ShaderMaterial({
                uniforms: uniforms,
                vertexShader: shader.vertexShader,
                fragmentShader: shader.fragmentShader,
                side: THREE.BackSide // The volume shader uses the backface as its "reference point"
            });

            const geometry = new THREE.BoxGeometry(volume.xLength, volume.yLength, volume.zLength);
            geometry.translate(volume.xLength / 2 - 0.5, volume.yLength / 2 - 0.5, volume.zLength / 2 - 0.5);

            volumeDentitionMesh = new THREE.Mesh(geometry, material);
            scene.add(volumeDentitionMesh);

            render();
        });
    }

	

	function onWindowResize() {

		renderer.setSize( window.innerWidth, window.innerHeight );

		const aspect = window.innerWidth / window.innerHeight;

		const frustumHeight = camera.top - camera.bottom;

		camera.left = - frustumHeight * aspect / 2;
		camera.right = frustumHeight * aspect / 2;

		camera.updateProjectionMatrix();

		render();

	}

	function render() {

		renderer.render( scene, camera );

	}

	function doRequestFile(path, value){
		const xhr = new XMLHttpRequest();
		xhr.open('GET', path, false);
        xhr.send(null);

        if (xhr.status === 200) {
        	const parser = new DOMParser();
            const htmlDoc = parser.parseFromString(xhr.responseText, 'text/html');
            const fileList = Array.from(htmlDoc.querySelectorAll('a')).map(a => a.getAttribute('href'));
			
			if(value==true){
				
				for (const file of fileList) {
					
					if (file.endsWith('.nrrd')) {
						var x = file.split('_');
						switch(x[1]){
							case 'Dentition.nrrd':
								dentition.push(`${file}`);
								break;
							case 'Mandible.nrrd':
								mandible.push(`${file}`);
								break;
							case 'MaxillaryComplex.nrrd':
								maxillaryComplex.push(`${file}`);
								break;
							case 'MaxillarySinus.nrrd':
								maxillarySinus.push(`${file}`);
								break;
							case 'Nerve.nrrd':
								nerve.push(`${file}`);
								break;
							case 'Pharynx.nrrd':
								pharynx.push(`${file}`);
								break;
							case 'Skull.nrrd':
								skull.push(`${file}`);
								break;
							case 'Input.nrrd':
								volumes.push(`${file}`);
								dataLabels[`P${index}`] = `${file}`;
								index++;
								break;
							default:
								console.log('Unknown case:', x);
								// Add your logic for unknown case here
						}
						
					}
				}
			}
			else{
				for (const file of fileList) {
					if (file.endsWith('/') && file.startsWith('\\')) {
						directories.push(`${file}`);
					}
				}
			}
        } else {
            console.error(`Failed to fetch volumes: ${xhr.status}`);
        }
	}

	</script>

</body>
</html>
