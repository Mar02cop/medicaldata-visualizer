<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>My first three.js app</title>
		<style>
			body { margin: 0; }
		</style>
	</head>

<body>
	<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@v0.149.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.149.0/examples/jsm/",
				"fs": "https://www.npmjs.com/package/fs-extra?activeTab=code"
			  }
		}
	</script>

	<script type="module">

	import * as FS from 'fs';
	import * as THREE from 'three';
	import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
	import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
	import { NRRDLoader } from 'three/addons/loaders/NRRDLoader.js';
	import { VolumeRenderShader1 } from 'three/addons/shaders/VolumeShader.js';

	const volumes =  [];

	let renderer,
		scene,
		camera,
		controls,
		material,
		volconfig,
		data,
		cmtextures;

	const dataLabels={};

	setup();
	init();

	function setup(){
		
		var fs = new FS;

		i = 1;
		while(true){
			path = '/volumi' + i;
			if(fs.pathExists()){
				volumes[i-1] = path;
			}
			else{
				break;
			}
			i+=1;
		}

		volumes.forEach((volume, index) => {
    		dataLabels[`P${index + 1}`] = volume;
		});
	
	}



	function init() {

		scene = new THREE.Scene();

		// Create renderer
		renderer = new THREE.WebGLRenderer();
		renderer.setPixelRatio( window.devicePixelRatio );
		renderer.setSize( window.innerWidth, window.innerHeight );
		document.body.appendChild( renderer.domElement );

		// Create camera (The volume renderer does not work very well with perspective yet)
		const h = 512; // frustum height
		const aspect = window.innerWidth / window.innerHeight;
		camera = new THREE.OrthographicCamera( - h * aspect / 2, h * aspect / 2, h / 2, - h / 2, 1, 1000 );
		camera.position.set( - 64, - 64, 128 );
		camera.up.set( 0, 0, 1 ); // In our data, z is up

		// Create controls
		controls = new OrbitControls( camera, renderer.domElement );
		controls.addEventListener( 'change', render );
		controls.target.set( 64, 64, 128 );
		controls.minZoom = 0.5;
		controls.maxZoom = 4;
		controls.enablePan = false;
		controls.update();

		// scene.add( new AxesHelper( 128 ) );

		// Lighting is baked into the shader a.t.m.
		// let dirLight = new DirectionalLight( 0xffffff );

		// The gui for interaction
		volconfig = { clim1: 0, clim2: 1, renderstyle: 'iso', isothreshold: 0.15, colormap: 'viridis',  data: volumes[0]};
		const gui = new GUI();
		gui.add( volconfig, 'clim1', 0, 1, 0.01 ).onChange( updateUniforms );
		gui.add( volconfig, 'clim2', 0, 1, 0.01 ).onChange( updateUniforms );
		gui.add( volconfig, 'colormap', { gray: 'gray', viridis: 'viridis' } ).onChange( updateUniforms );
		gui.add( volconfig, 'renderstyle', { mip: 'mip', iso: 'iso' } ).onChange( updateUniforms );
		gui.add( volconfig, 'isothreshold', 0, 1, 0.01 ).onChange( updateUniforms );
		gui.add(volconfig, 'data', dataLabels).onChange(updateVolume);

		loadVolume(volconfig.data);

		window.addEventListener( 'resize', onWindowResize );

	}

	function updateUniforms() {

		material.uniforms[ 'u_clim' ].value.set( volconfig.clim1, volconfig.clim2 );
		material.uniforms[ 'u_renderstyle' ].value = volconfig.renderstyle == 'mip' ? 0 : 1; // 0: MIP, 1: ISO
		material.uniforms[ 'u_renderthreshold' ].value = volconfig.isothreshold; // For ISO renderstyle
		material.uniforms[ 'u_cmdata' ].value = cmtextures[ volconfig.colormap ];

		render();

	}

	function updateVolume(){
		//scene.remove(volconfig);
		scene.clear();
		loadVolume(volconfig.data);
	}

	function loadVolume(data){
		// Load the data ...
		new NRRDLoader().load(data, function ( volume ) {

		// Texture to hold the volume. We have scalars, so we put our data in the red channel.
		// THREEJS will select R32F (33326) based on the THREE.RedFormat and THREE.FloatType.
		// Also see https://www.khronos.org/registry/webgl/specs/latest/2.0/#TEXTURE_TYPES_FORMATS_FROM_DOM_ELEMENTS_TABLE
		// TODO: look the dtype up in the volume metadata
		const texture = new THREE.Data3DTexture( volume.data, volume.xLength, volume.yLength, volume.zLength );
		texture.format = THREE.RedFormat;
		texture.type = THREE.UnsignedByteType;
		texture.minFilter = texture.magFilter = THREE.LinearFilter;
		//texture.unpackAlignment = 1;
		texture.needsUpdate = true;

		// Colormap textures
		cmtextures = {
			viridis: new THREE.TextureLoader().load( '/others/cm_viridis.png', render ),
			gray: new THREE.TextureLoader().load( '/others/cm_gray.png', render )
		};


		// Material
		const shader = VolumeRenderShader1;

		const uniforms = THREE.UniformsUtils.clone( shader.uniforms );

		uniforms[ 'u_data' ].value = texture;
		uniforms[ 'u_size' ].value.set( volume.xLength, volume.yLength, volume.zLength );
		uniforms[ 'u_clim' ].value.set( volconfig.clim1, volconfig.clim2 );
		uniforms[ 'u_renderstyle' ].value = volconfig.renderstyle == 'mip' ? 0 : 1; // 0: MIP, 1: ISO
		uniforms[ 'u_renderthreshold' ].value = volconfig.isothreshold; // For ISO renderstyle
		uniforms[ 'u_cmdata' ].value = cmtextures[ volconfig.colormap ];


		material = new THREE.ShaderMaterial( {
			uniforms: uniforms,
			vertexShader: shader.vertexShader,
			fragmentShader: shader.fragmentShader,
			side: THREE.BackSide // The volume shader uses the backface as its "reference point"
		} );

		// THREE.Mesh
		const geometry = new THREE.BoxGeometry( volume.xLength, volume.yLength, volume.zLength );
		geometry.translate( volume.xLength / 2 - 0.5, volume.yLength / 2 - 0.5, volume.zLength / 2 - 0.5 );

		const mesh = new THREE.Mesh( geometry, material );
		scene.add( mesh );

		render();

		} );
	}

	

	function onWindowResize() {

		renderer.setSize( window.innerWidth, window.innerHeight );

		const aspect = window.innerWidth / window.innerHeight;

		const frustumHeight = camera.top - camera.bottom;

		camera.left = - frustumHeight * aspect / 2;
		camera.right = frustumHeight * aspect / 2;

		camera.updateProjectionMatrix();

		render();

	}

	function render() {

		renderer.render( scene, camera );

	}


	</script>

</body>
</html>
